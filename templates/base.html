<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    
    <title>FlashPack | {% block title %}{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        :root {
            --flash-blue: #0f172a;
            --flash-orange: #e67e22;
        }
        
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden; /* Empêche le scroll horizontal */
        }

        /* --- STYLE GÉNÉRAL (PC) --- */
        .panier-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 40px;
            align-items: start;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* FIX GLOBAL POUR LES GRILLES DE PRODUITS */
        div[class*="card"] img, .produit-card img, .product-card img, [style*="display: grid"] img {
            width: 100% !important;
            max-width: 100% !important;
            height: 200px !important;
            object-fit: contain !important;
            display: block !important;
            margin: 0 auto 15px auto !important;
            padding: 10px;
            box-sizing: border-box;
        }

        .produit-card, [style*="background: white"] {
            overflow: hidden !important;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- CONFIGURATION RESPONSIVE TOTALE (MOBILE) --- */
        @media (max-width: 768px) {
            /* Reset Global */
            html, body {
                width: 100%;
                padding: 0;
            }

            /* Header et Navbar */
            .header-container {
                flex-direction: column !important;
                gap: 15px;
            }

            .main-nav {
                flex-direction: column !important;
                gap: 12px !important;
                width: 100%;
            }

            .main-nav a {
                font-size: 1rem !important;
            }

            /* Menu Utilisateur (Connecté/Déconnecté) */
            .user-menu {
                flex-direction: column !important;
                gap: 10px !important;
                width: 100%;
                border-top: 1px solid rgba(255,255,255,0.1);
                padding-top: 10px;
                text-align: center;
            }

            .user-menu a {
                width: auto !important;
                display: inline-block;
            }

            /* Pages et Grilles */
            .panier-grid, .produits-grid, .panier-wrapper, .cart-container, div[style*="display: grid"] {
                display: flex !important;
                flex-direction: column !important;
                gap: 20px !important;
                width: 100% !important;
                padding: 10px !important;
                box-sizing: border-box !important;
            }

            /* Conteneurs */
            div[style*="max-width: 1200px"], .container {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 10px !important;
                box-sizing: border-box !important;
            }

            /* Formulaires */
            input, select, textarea {
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
                margin: 10px 0 !important;
            }

            /* Boutons et Actions */
            .product-actions, div[style*="align-items: center"] {
                flex-direction: column !important;
                gap: 15px !important;
            }

            button[style*="background: #e67e22"], .btn-add-to-cart {
                width: 100% !important;
                padding: 15px !important;
                font-size: 1.1rem !important;
            }

            /* Typographie et Images */
            h1 { 
                font-size: 1.5rem !important; 
                text-align: center !important; 
            }

            div[class*="card"] img, .produit-card img {
                height: 150px !important;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
</head>
<body>

    <header style="background: var(--flash-blue); padding: 15px 5%; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <div class="header-container">
            
            <div class="logo">
                <a href="/" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" 
                         alt="FlashPack Logo" 
                         style="height: 60px; width: auto; display: block; object-fit: contain;">
                    <span style="color: white; font-weight: 800; font-size: 1.5rem; margin-left: 10px;">
                        FlashPack<span style="color: var(--flash-orange);">TN</span>
                    </span>
                </a>
            </div>

            <nav class="main-nav">
                <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
                    <a href="/" style="color: white; text-decoration: none; font-weight: 600; transition: 0.3s;">Accueil</a>
                    <a href="/boutique" style="color: white; text-decoration: none; font-weight: 600; transition: 0.3s;">Boutique</a>
                    <a href="/panier" style="color: white; text-decoration: none; font-weight: 600; transition: 0.3s;">Panier 🛒</a>
                </div>
                
                {% if session.get('nom') %}
                    <div class="user-menu">
                        <span style="color: white; font-size: 0.9rem;">Bonjour, <strong>{{ session.nom }}</strong></span>
                        <a href="/logout" style="color: var(--flash-orange); text-decoration: none; font-weight: bold; font-size: 0.9rem; border: 1px solid var(--flash-orange); padding: 5px 10px; border-radius: 5px;">Déconnexion</a>
                    </div>
                {% else %}
                    <div class="user-menu">
                        <a href="/compte" style="background: var(--flash-orange); color: white; padding: 10px 25px; border-radius: 8px; text-decoration: none; font-weight: 700; transition: 0.3s; box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);">Mon Compte</a>
                    </div>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer style="background: #0f172a; color: #64748b; padding: 30px 5%; text-align: center; border-top: 1px solid rgba(255,255,255,0.1);">
        <p>&copy; 2026 FlashPack TN. Tous droits réservés. <br> Expertise en emballage industriel et e-commerce.</p>
    </footer>

</body>
</html>
