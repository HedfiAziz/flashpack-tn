{% extends "base.html" %}
{% block content %}
<style>
    /* --- STYLES GLOBAUX CONNEXION/INSCRIPTION --- */
    .auth-container { 
        min-height: 80vh; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 20px; 
    }
    
    .auth-box { 
        background: white; 
        padding: 40px; 
        border-radius: 20px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        max-width: 500px; 
        width: 100%; 
        box-sizing: border-box; /* Crucial pour ne pas déborder */
    }

    .auth-title { 
        color: var(--flash-orange); 
        margin-bottom: 10px; 
        font-size: 1.8rem;
        margin-top: 0;
    }

    .auth-subtitle { 
        color: #64748b; 
        margin-bottom: 25px; 
        font-size: 1rem;
    }

    .error-msg { 
        color: #ef4444; 
        background: #fee2e2; 
        padding: 12px; 
        border-radius: 8px; 
        font-size: 0.9rem; 
        text-align: center; 
        font-weight: bold; 
        margin-bottom: 20px;
    }

    /* --- FORMULAIRE --- */
    .form-grid { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 15px; 
    }

    .form-label { 
        display: block; 
        font-weight: 600; 
        margin-top: 15px; 
        margin-bottom: 5px; 
        font-size: 0.95rem; 
        color: #1e293b;
    }

    .form-grid .form-label { 
        margin-top: 0; 
    }

    .form-input { 
        width: 100%; 
        padding: 12px; 
        border-radius: 8px; 
        border: 1px solid #e2e8f0; 
        box-sizing: border-box; 
        font-size: 1rem;
        font-family: inherit;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--flash-orange);
    }

    .form-textarea { 
        height: 80px; 
        resize: vertical; 
    }

    .btn-submit { 
        width: 100%; 
        margin-top: 25px; 
        background: #0f172a; 
        color: white; 
        padding: 15px; 
        border: none; 
        border-radius: 10px; 
        cursor: pointer; 
        font-weight: bold; 
        font-size: 1.05rem; 
        transition: 0.3s; 
    }

    .btn-submit:hover { 
        background: var(--flash-orange); 
    }

    .auth-link { 
        text-align: center; 
        margin-top: 20px; 
        font-size: 0.95rem; 
        color: #64748b;
    }

    .auth-link a {
        color: var(--flash-blue); 
        font-weight: bold;
        text-decoration: none;
    }

    /* --- OPTIMISATION MOBILE (iPhone 4 / 320px) --- */
    @media (max-width: 480px) {
        .auth-container { 
            padding: 15px 10px; 
        }
        
        .auth-box { 
            padding: 25px 20px; /* Marges réduites */
            border-radius: 16px;
        }

        .auth-title { 
            font-size: 1.5rem; 
        }

        .form-grid { 
            grid-template-columns: 1fr; /* Empile Nom et Téléphone */
            gap: 0; 
        }

        .form-grid > div { 
            margin-bottom: 5px; 
        }

        .form-label {
            margin-top: 10px;
        }

        .form-input { 
            padding: 10px; 
            font-size: 0.95rem; 
        }

        .btn-submit { 
            padding: 12px; 
            font-size: 1rem;
            margin-top: 20px;
        }
    }
</style>

<div class="auth-container">
    <div class="auth-box">
        <h2 class="auth-title">Rejoignez FlashPack TN 🚀</h2>
        <p class="auth-subtitle">Créez votre profil pour commander en un clic.</p>

        {% if erreur %}
            <p class="error-msg">⚠️ {{ erreur }}</p>
        {% endif %}

        <form action="/finaliser_inscription" method="POST">
            <div class="form-grid">
                <div>
                    <label class="form-label">Nom / Société</label>
                    <input type="text" name="nom" required minlength="3" maxlength="100" placeholder="Ex: FlashPack" class="form-input">
                </div>
                <div>
                    <label class="form-label">Téléphone</label>
                    <input type="tel" name="tel" required pattern="[0-9]{8}" maxlength="8" title="Veuillez entrer un numéro de téléphone à 8 chiffres (ex: 99999999)" placeholder="Ex: 99999999" class="form-input">
                </div>
            </div>

            <label class="form-label">Adresse de livraison complète</label>
            <textarea name="adresse" required minlength="10" placeholder="Ex: 15 Avenue Habib Bourguiba, 1001 Tunis..." class="form-input form-textarea"></textarea>

            <label class="form-label">Choisissez un mot de passe</label>
            <input type="password" name="mdp" required minlength="6" placeholder="Minimum 6 caractères" class="form-input">

            <button type="submit" class="btn-submit">
                Créer mon compte
            </button>
            
            <p class="auth-link">
                Déjà inscrit ? <a href="/compte">Se connecter</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
