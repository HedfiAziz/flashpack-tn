{% extends "base.html" %}
{% block content %}
<style>
    .form-container {
        padding: 40px 20px;
    }
    
    .form-title {
        color: var(--flash-blue); 
        text-align: center; 
        margin-bottom: 30px;
        font-size: 2rem;
    }

    .form-box {
        max-width: 600px; 
        margin: 0 auto; 
        background: white; 
        padding: 30px; 
        border-radius: 15px; 
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        box-sizing: border-box;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-label {
        font-weight: bold; 
        display: block; 
        margin-bottom: 5px;
        color: #1e293b;
    }

    .form-input, .form-textarea {
        width: 100%; 
        padding: 12px; 
        border-radius: 8px; 
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 1rem;
    }
    
    .form-textarea {
        min-height: 100px;
        resize: vertical;
    }

    .form-input:focus, .form-textarea:focus {
        outline: none;
        border-color: var(--flash-orange);
    }

    .grid-2-cols {
        display: flex; 
        gap: 15px; 
        margin-bottom: 15px;
    }

    .grid-2-cols > div {
        flex: 1;
    }

    .info-box {
        margin-bottom: 15px; 
        background: #f8fafc; 
        padding: 15px; 
        border-radius: 8px; 
        border-left: 4px solid var(--flash-blue);
    }
    
    .info-text {
        font-size: 0.85rem; 
        color: #64748b; 
        margin-top: 0; 
        margin-bottom: 10px;
    }

    .checkbox-box {
        margin-bottom: 25px; 
        background: #fff7ed; 
        padding: 15px; 
        border-radius: 8px; 
        border: 1px dashed #fb923c;
    }

    .checkbox-label {
        cursor: pointer; 
        font-weight: bold; 
        color: #9a3412; 
        display: flex; 
        align-items: center; 
        gap: 10px;
        font-size: 0.95rem;
    }

    .btn-submit {
        width: 100%; 
        background: var(--flash-blue); 
        color: white; 
        padding: 15px; 
        font-size: 1.1rem; 
        font-weight: bold;
        border-radius: 10px; 
        border: none; 
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-submit:hover {
        background: var(--flash-orange);
    }

    .cancel-link {
        display: block; 
        text-align: center; 
        margin-top: 15px; 
        color: #64748b; 
        text-decoration: none;
        font-weight: 600;
    }

    @media (max-width: 480px) {
        .form-container {
            padding: 20px 10px;
        }
        
        .form-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        .form-box {
            padding: 20px 15px;
        }

        .grid-2-cols {
            flex-direction: column; /* Empile le prix et le stock sur mobile */
            gap: 15px;
        }

        .form-input, .form-textarea {
            padding: 10px;
        }

        .btn-submit {
            padding: 12px;
            font-size: 1rem;
        }
    }
</style>

<div class="form-container">
    <h2 class="form-title">{{ action }} un Produit</h2>

    <div class="form-box">
        <form method="POST">
            
            <div class="form-group">
                <label class="form-label">Nom du produit :</label>
                <input type="text" name="nom" value="{{ produit.nom if produit else '' }}" required class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Description courte :</label>
                <textarea name="description" required class="form-textarea">{{ produit.description if produit else '' }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Détails (ex: Épaisseur, Matière) :</label>
                <input type="text" name="details" value="{{ produit.details if produit else '' }}" class="form-input">
            </div>

            <div class="grid-2-cols">
                <div>
                    <label class="form-label">Prix unitaire par défaut (DT) :</label>
                    <input type="number" step="0.001" name="prix" value="{{ produit.prix_raw if produit else '' }}" required class="form-input">
                </div>
                <div>
                    <label class="form-label">Stock actuel :</label>
                    <input type="number" name="stock" value="{{ produit.stock if produit else '100' }}" required class="form-input">
                </div>
            </div>

            <div class="info-box">
                <label class="form-label">Dimensions et Prix variables :</label>
                <p class="info-text">Format exact obligatoire 👉 Taille:Prix, Taille:Prix <br> <i>Exemple : 4x6:0.050, 10x15:0.100, 20x30:0.250</i></p>
                <input type="text" name="dimensions" value="{{ produit.dimensions if produit and produit.dimensions else '' }}" placeholder="Ex: 10x15:0.500, 15x20:0.850" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Nom de l'image (ex: scotch.jpg) :</label>
                <input type="text" name="image" value="{{ produit.image if produit else '' }}" required class="form-input">
            </div>

            <div class="checkbox-box">
                <label class="checkbox-label">
                    <input type="checkbox" name="perso" style="width: 20px; height: 20px;" {% if produit and produit.est_personnalisable %}checked{% endif %}>
                    Activer l'option "Design Personnalisé"
                </label>
            </div>

            <button type="submit" class="btn-submit">
                Enregistrer le produit
            </button>
            <a href="/admin" class="cancel-link">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
