{% extends "base.html" %}
{% block content %}
<style>
    /* Réutilisation de la même structure propre pour une cohérence visuelle */
    .auth-container { 
        min-height: 80vh; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 20px; 
    }
    
    .auth-box { 
        background: white; 
        padding: 40px; 
        border-radius: 20px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        max-width: 450px; 
        width: 100%; 
        box-sizing: border-box; 
    }

    .auth-title { 
        color: var(--flash-blue); 
        margin-bottom: 5px; 
        font-size: 1.8rem;
        margin-top: 0;
    }

    .auth-subtitle { 
        color: #64748b; 
        margin-bottom: 25px; 
    }

    .error-msg { 
        color: #ef4444; 
        background: #fee2e2; 
        padding: 12px; 
        border-radius: 8px; 
        font-size: 0.9rem; 
        text-align: center;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .form-label { 
        display: block; 
        font-weight: 600; 
        margin-bottom: 8px; 
        color: #1e293b;
    }

    .form-input { 
        width: 100%; 
        padding: 12px; 
        margin-bottom: 20px; 
        border-radius: 8px; 
        border: 1px solid #e2e8f0; 
        box-sizing: border-box; 
        font-size: 1rem;
        font-family: inherit;
    }

    .btn-submit { 
        width: 100%; 
        background: var(--flash-blue); 
        color: white; 
        padding: 15px; 
        border: none; 
        border-radius: 10px; 
        cursor: pointer; 
        font-weight: bold; 
        font-size: 1.05rem;
        transition: 0.3s; 
    }

    .btn-submit:hover {
        background: var(--flash-orange);
    }

    .divider-box { 
        text-align: center; 
        margin-top: 30px; 
        border-top: 1px solid #f1f5f9; 
        padding-top: 25px; 
    }

    .divider-text {
        margin-bottom: 15px;
        color: #64748b;
        margin-top: 0;
    }

    .btn-outline { 
        color: var(--flash-orange); 
        text-decoration: none; 
        font-weight: bold; 
        border: 2px solid var(--flash-orange); 
        padding: 12px 20px; 
        border-radius: 10px; 
        display: inline-block;
        transition: 0.3s;
    }

    .btn-outline:hover {
        background: var(--flash-orange);
        color: white;
    }

    /* --- OPTIMISATION MOBILE (iPhone 4 / 320px) --- */
    @media (max-width: 480px) {
        .auth-container { padding: 15px 10px; }
        .auth-box { padding: 25px 20px; border-radius: 16px; }
        .auth-title { font-size: 1.6rem; }
        .form-input { padding: 10px; margin-bottom: 15px; font-size: 0.95rem; }
        .btn-submit { padding: 12px; font-size: 1rem; }
        .divider-box { margin-top: 20px; padding-top: 20px; }
        .btn-outline { padding: 10px 15px; font-size: 0.95rem; }
    }
</style>

<div class="auth-container">
    <div class="auth-box">
        
        <h2 class="auth-title">Déjà client ?</h2>
        <p class="auth-subtitle">Connectez-vous à votre espace.</p>

        {% if erreur %}
            <p class="error-msg">⚠️ {{ erreur }}</p>
        {% endif %}

        <form action="/compte" method="POST">
            <label class="form-label">Téléphone</label>
            <input type="text" name="tel" required pattern="([0-9]{8}|admin)" maxlength="8" title="Veuillez entrer un numéro à 8 chiffres ou votre identifiant" placeholder="Ex: 21023363" class="form-input">

            <label class="form-label">Mot de passe</label>
            <input type="password" name="mdp" required minlength="4" placeholder="Votre mot de passe" class="form-input">

            <button type="submit" class="btn-submit">
                Se connecter
            </button>
        </form>

        <div class="divider-box">
            <p class="divider-text">Nouveau chez FlashPack ?</p>
            <a href="/inscription_debut" class="btn-outline">
                Créer un compte
            </a>
        </div>
    </div>
</div>
{% endblock %}
